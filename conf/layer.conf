# https://gerrit.automotivelinux.org/gerrit/gitweb?p=AGL/meta-agl-devel.git;a=tree;f=meta-offline-voice-agent;hb=HEAD

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += " \
        ${LAYERDIR}/recipes-*/*.bb \
        ${LAYERDIR}/recipes-*/*.bbappend \
        ${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "vosk"
BBFILE_PATTERN_vosk = "^${LAYERDIR}/"
BBFILE_PRIORITY_vosk = "5"

LAYERSERIES_COMPAT_vosk = "dunfell scarthgap"

PREFERRED_PROVIDER_virtual/vosk-model ?= " vosk-model-small-en-us"
